<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ativar Pro · Orçamento Rápido</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/guias/guia.css">
</head>
<body>
<div class="wrap">
<header><a href="/"><i></i>Orçamento Rápido</a></header>
<h1 id="t">A ativar o plano Pro…</h1>
<p class="lead" id="m">Estamos a confirmar o pagamento com o Stripe. Demora poucos segundos.</p>
<p><a class="btn" href="/" id="go" hidden>Abrir o Orçamento Rápido</a></p>
</div>
<script>
(async () => {
  const t = document.getElementById('t'), m = document.getElementById('m'), go = document.getElementById('go');
  const id = new URLSearchParams(location.search).get('session_id');
  const fail = msg => { t.textContent = 'Não foi possível ativar o Pro'; m.textContent = msg + ' Se o pagamento foi feito, responda ao email de confirmação do Stripe e ativamos manualmente.'; go.hidden = false; };
  if (!id) return fail('Falta a referência do pagamento.');
  try {
    const r = await fetch('/api/ativar?session_id=' + encodeURIComponent(id), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) return fail(j.erro || 'Erro desconhecido.');
    try { localStorage.setItem('or_pro', JSON.stringify({ sub: j.sub, checked: Date.now() })); } catch (e) { return fail('Este browser não deixa guardar dados.'); }
    t.textContent = 'Plano Pro ativo';
    m.textContent = 'Já pode exportar PDF com o seu logótipo, guardar o histórico e usar a sua tabela de preços.';
    go.hidden = false;
  } catch (e) { fail('Sem ligação à internet.'); }
})();
</script>
</body>
</html>
